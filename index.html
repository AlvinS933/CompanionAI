<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Companion AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

    #overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 9999;
    }

    #pull-tab {
      pointer-events: all;
      cursor: pointer;
      background: rgba(40, 40, 60, 0.95);
      border: 0.5px solid rgba(255,255,255,0.22);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      padding: 6px 20px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    #pull-tab:hover { background: rgba(60, 60, 90, 0.95); }

    .pill { width: 28px; height: 3px; background: rgba(255,255,255,0.5); border-radius: 2px; }
    .tab-label { font-size: 10px; color: rgba(255,255,255,0.6); font-family: system-ui, sans-serif; letter-spacing: 0.05em; }

    #chat-panel {
      pointer-events: all;
      width: 100%;
      max-width: 640px;
      background: rgba(10, 10, 20, 0.95);
      border-top: 0.5px solid rgba(255,255,255,0.15);
      height: 0;
      overflow: hidden;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    #chat-panel.open { height: 60px; }

    #input-row {
      display: flex;
      gap: 8px;
      padding: 8px 12px 14px;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
      outline: none;
      font-family: system-ui, sans-serif;
      transition: border-color 0.2s;
    }
    #chat-input::placeholder { color: rgba(255,255,255,0.3); }
    #chat-input:focus { border-color: rgba(99,102,241,0.8); }

    #send-btn {
      background: rgba(99,102,241,0.8);
      border: none;
      border-radius: 50%;
      width: 36px; height: 36px;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 16px;
      color: #fff;
      transition: background 0.2s, transform 0.1s;
    }
    #send-btn:hover { background: rgba(99,102,241,1); }
    #send-btn:active { transform: scale(0.92); }
  </style>
</head>
<body style="-webkit-app-region: drag;">

  <div id="overlay" style="-webkit-app-region: no-drag;">
    <div id="pull-tab">
      <div class="pill"></div>
      <span class="tab-label" id="tab-label">companion</span>
    </div>
    <div id="chat-panel">
      <div id="input-row">
        <input id="chat-input" type="text" placeholder="Ask your companion… (q to quit)" autocomplete="off" />
        <button id="send-btn">↑</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/renderer.ts"></script>
  <script>
    let isOpen = false;
    const panel   = document.getElementById('chat-panel');
    const pullTab = document.getElementById('pull-tab');
    const sendBtn = document.getElementById('send-btn');
    const input   = document.getElementById('chat-input');
    const tabLabel = document.getElementById('tab-label');

    function togglePanel() {
      isOpen = !isOpen;
      panel.classList.toggle('open', isOpen);
      tabLabel.textContent = isOpen ? 'close ↓' : 'companion';
      if (isOpen) {
        window.companion.setPanelOpen(true);
        setTimeout(() => input.focus(), 360);
      } else {
        window.companion.setPanelOpen(false);
      }
    }

    pullTab.addEventListener('click', togglePanel);
    pullTab.addEventListener('mouseenter', () => window.companion.setIgnoreMouse(false));
    pullTab.addEventListener('mouseleave', () => { if (!isOpen) window.companion.setIgnoreMouse(true); });

    function sendMsg() {
      const text = input.value.trim();
      if (!text) return;
      if (text.toLowerCase() === 'q') {
        window.companion.quit();
        return;
      }
      input.value = '';
      window.companion.sendMessage(text);
    }

    sendBtn.addEventListener('click', sendMsg);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
  </script>
</body>
</html>
